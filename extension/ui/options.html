<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>语言包管理 · 翻译助手</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
          <rect class="logo-mark" width="512" height="512" rx="112" />
          <rect class="logo-bubble" x="112" y="128" width="288" height="204" rx="52" />
          <path class="logo-bubble" d="M232 316 L150 388 L196 316 Z" />
          <text class="logo-glyph" x="256" y="248" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"
                font-size="150" font-weight="700"
                text-anchor="middle" dominant-baseline="central" data-i18n="brand_mark">译</text>
        </svg>
        <div class="hero-text">
          <h1 data-i18n="options_title">语言包管理</h1>
          <p class="lead">
            <span data-i18n="options_lead">翻译在你的浏览器里完成，不需要 API Key。首次使用某个方向会下载对应语言包，之后可离线使用。</span>
          </p>
          <p class="source">
            <span data-i18n="options_source">模型来源：</span><a href="https://github.com/mozilla/firefox-translations-models" target="_blank" rel="noreferrer">Mozilla Firefox Translations</a>　·　<span data-i18n="options_license">许可证：</span>MPL-2.0　·
            <span data-i18n="options_runtime">运行时：</span><a href="https://github.com/browsermt/bergamot-translator" target="_blank" rel="noreferrer">bergamot-translator</a>（MPL-2.0）
          </p>
        </div>
      </header>

      <div class="lang-row">
        <label for="ui-lang" data-i18n="ui_language">界面语言</label>
        <select id="ui-lang">
          <option value="">跟随浏览器</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="totals">
        <span id="totals">…</span>
        <span class="spacer"></span>
        <button id="refresh" class="link" type="button" data-i18n="options_refresh">刷新</button>
      </div>

      <div class="bar" id="bar" hidden><i></i></div>
      <p class="status" id="status"></p>

      <section>
        <h2 data-i18n="options_combos">常用组合</h2>
        <p class="hint">
          <span data-i18n="options_combos_hint">Mozilla 只发布「各语言 ↔ 英语」的模型，所以中文 ↔ 日语这类方向会经英语中转，需要两个语言包。</span>
        </p>
        <div id="combos" class="cards"></div>
      </section>

      <section>
        <h2 data-i18n="options_all">全部语言包</h2>
        <input id="search" type="search" data-i18n-placeholder="options_search_ph" placeholder="搜索语言，例如：日语 / ja / 韩" autocomplete="off" />
        <div id="packs" class="list"></div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
